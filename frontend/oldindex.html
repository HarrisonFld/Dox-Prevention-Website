<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FastAPI File Uploader</title>
</head>
<body>

    <input type="file" id="fileInput"><br><br>

    <!-- Input for the path parameter 'sections' -->
    <label for="sectionsInput">Sections: </label>
    <input type="text" id="sectionsInput" value="all"><br><br>

    <button id="uploadBtn">Upload & Parse</button>
    <button id="modifyBtn">Modify & Download File</button>
    <pre id="result"></pre>

    <script>
        // Existing Upload/Parse Button Logic
        document.getElementById('uploadBtn').addEventListener('click', async () => {
            const fileInput = document.getElementById('fileInput');
            const resultPre = document.getElementById('result');

            if (fileInput.files.length === 0) {
                alert('Please select a file first.');
                return;
            }

            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('file', file);

            resultPre.textContent = 'Uploading...';

            try {
                const response = await fetch('http://localhost:9000/parse-file', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`Server returned status ${response.status}`);
                }

                const data = await response.json();
                resultPre.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                resultPre.textContent = `Error: ${error.message}`;
            }
        });

        // New Modify File Button Logic (Handles FileResponse download)
        document.getElementById('modifyBtn').addEventListener('click', async () => {
            const fileInput = document.getElementById('fileInput');
            const sectionsInput = document.getElementById('sectionsInput');
            const resultPre = document.getElementById('result');

            if (fileInput.files.length === 0) {
                alert('Please select a file first.');
                return;
            }

            const file = fileInput.files[0];
            const sections = sectionsInput.value.trim() || 'all';
            const formData = new FormData();
            formData.append('file', file);

            resultPre.textContent = 'Modifying file...';

            try {
                // Sends request to /modify_file/{sections}
                const response = await fetch(`http://localhost:9000/modify_file/${encodeURIComponent(sections)}`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`Server returned status ${response.status}`);
                }

                // Because FastAPI returns a FileResponse, read it as a binary Blob
                const blob = await response.blob();
                const downloadUrl = window.URL.createObjectURL(blob);

                // Programmatically create a temporary link to trigger the browser download
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = file.name; // Keep the original filename
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(downloadUrl);

                resultPre.textContent = 'File modified and downloaded successfully!';
            } catch (error) {
                resultPre.textContent = `Error: ${error.message}`;
            }
        });
    </script>

</body>
</html>
